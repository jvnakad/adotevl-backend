# Banco local para desenvolvimento (substitui o Supabase em dev).
# Porta 5433 no host para não conflitar com um Postgres nativo na 5432.
services:
  postgres:
    image: postgres:15
    container_name: adotevl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adotevl
      POSTGRES_PASSWORD: adotevl
      POSTGRES_DB: adotevl
    ports:
      - '5433:5432'
    volumes:
      - adotevl-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adotevl -d adotevl']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  adotevl-pgdata:
